# Add this service next to homeassistant + mosquitto in your docker-compose.yml.
# In ./sensor-bridge/config.toml use  host = "mosquitto"  (compose service name).
services:
  sensor-bridge:
    build: https://github.com/grzegorz-grzeda/g2labs-sensor-bridge.git#main
    container_name: sensor-bridge
    hostname: g2labs-rpi                # instance name; without it the container ID (changes on rebuild) is used
    restart: unless-stopped
    depends_on: [mosquitto]
    volumes:
      - ./sensor-bridge:/config:ro
      - /run/dbus:/run/dbus:ro          # host BlueZ (BLE)
      - ./sensor-bridge/state:/var/lib/sensor-bridge   # persistent state (rtl_433 learned bindings)
    # RTL-SDR dongle for the rtl433 source. On the host blacklist the DVB-T driver first:
    #   echo 'blacklist dvb_usb_rtl28xxu' | sudo tee /etc/modprobe.d/blacklist-rtl-sdr.conf
    devices:
      - /dev/bus/usb:/dev/bus/usb
