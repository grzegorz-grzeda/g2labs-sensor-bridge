[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g2labs-sensor-bridge"
version = "0.1.0"
description = "Bridge home sensors (BLE, SDR/rtl_433, ...) to Home Assistant via MQTT discovery"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Grzegorz Grzęda" }]
dependencies = ["paho-mqtt>=2.0"]

[project.optional-dependencies]
ble = ["bleak>=0.22"]
dev = ["pytest>=8"]

[project.scripts]
sensor-bridge = "sensor_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
