# g2labs-sensor-bridge  ->  /etc/sensor-bridge/config.toml
log_level = "INFO"

# ---------------------------------------------------------------- sources
[[sources]]
type = "ble"
# adapter = "hci0"            # Linux: which BT adapter
decoders = ["atc"]            # see src/sensor_bridge/sources/decoders
restart_scan_every = 600      # [s] periodic scanner restart (BlueZ can stall); 0 = never
only_named = false            # true = ignore devices not listed in [devices.names]

[[sources]]
type = "rtl433"               # EXPERIMENTAL, needs rtl_433 + RTL-SDR dongle
enabled = false
command = ["rtl_433", "-C", "si", "-F", "json", "-M", "level"]
# 868 MHz FSK stations, e.g. Bresser 5/6/7-in-1 (also sold as Sencor SWS 9300):
# command = ["rtl_433", "-C", "si", "-F", "json", "-M", "level", "-f", "868.3M", "-s", "1024k"]
merge_max_age = 900           # [s] stations alternating frame types: keep last value of each metric this long
only_named = true             # 433 MHz is full of neighbours' sensors
relearn_after = 300           # [s] learn mode: follow a new id after the bound one is silent this long
state_file = "/var/lib/sensor-bridge/rtl433_bindings.json"   # learned id bindings

[[sources]]
type = "system"               # this machine: CPU temperature/usage, memory, disk  (needs extra [system])
interval = 60                 # [s]
# hostname = "g2labs-rpi"     # device name/id in HA, default: hostname
# disk_path = "/"
# temperature_sensor = "coretemp"   # psutil sensors_temperatures() key, default: auto

# ---------------------------------------------------------------- sinks
[[sinks]]
type = "mqtt_ha"
host = "g2labs-rpi"
port = 1883
username = "sensor-bridge"
password = "change-me"
# tls = true
# instance = "pc"             # bridge name, default: hostname. Must be unique per machine and STABLE
                              # (in Docker set it here or via compose `hostname:`, the container ID changes).
# client_id = ...             # default: "sensor-bridge-<instance>". Must be unique per machine!
base_topic = "sensor-bridge"  # same on all instances
discovery_prefix = "homeassistant"
expire_after = 900            # [s] entity becomes "unavailable" after this much silence

# Multiple receivers (e.g. PC + Raspberry Pi): each sensor is published by one instance at a time.
takeover_after = 300          # [s] take a sensor over when its current receiver is silent this long
rssi_hysteresis = 6           # [dB] or when we hear it this much stronger than the current receiver

# ---------------------------------------------------------------- devices
[devices]
min_interval = 30             # [s] max one publish per device per this period

# Keep [devices.names] identical on all instances - names go into HA discovery.
[devices.names]
# key: device_id or alias (BLE: MAC, rtl_433: "model/id[/channel]")
# rtl_433 learn mode: "model/*/channel" pairs with the first id heard on that channel and follows
# id changes after battery swaps (like the original weather station console does).
"A4:C1:38:00:00:01" = "Salon"
"A4:C1:38:00:00:02" = "Sypialnia"
# "Nexus-TH/*/1" = "Na zewnątrz"
# "Bresser-6in1/*/0" = "Stacja pogodowa"
# "Acurite-Tower/12345/A" = "Balkon"
